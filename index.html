    <!-- Structured Data JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "DeepClaim.AI",
          "url": "https://deepclaim.ai",
          "logo": "https://deepclaim.ai/logo.png",
          "description": "AI agent for Indian hospitals to stop and recover absorbed insurance claim cuts and track procedure profitability by payer.",
          "founder": {
            "@type": "Person",
            "name": "Padmini Janaki",
            "jobTitle": "Founder & CEO"
          }
        },
        {
          "@type": "SoftwareApplication",
          "name": "DeepClaim",
          "applicationCategory": "HealthApplication, FinanceApplication",
          "operatingSystem": "Web, WhatsApp",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "INR",
            "description": "Free initial claim audit"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Does DeepClaim replace our hospital software?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. It only reads exports from your existing systems. Nothing changes for your billing team."
              }
            },
            {
              "@type": "Question",
              "name": "Will insurers see our data?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. DeepClaim works for the hospital. Nothing is shared with insurers unless your team sends an appeal."
              }
            },
            {
              "@type": "Question",
              "name": "How is patient data protected?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Hosted in India, patient identifiers pseudonymised, encrypted, with role-based access and an audit log. We sign a data processing agreement with every hospital."
              }
            },
            {
              "@type": "Question",
              "name": "Isn't every insurance cut a loss for the hospital?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. Many cuts are paid by the patient at discharge. DeepClaim separates those and focuses on the ones your hospital absorbs."
              }
            },
            {
              "@type": "Question",
              "name": "Do you guarantee a recovery amount?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. We show you what is recoverable and help your team appeal. The audit shows the size of your opportunity before you commit."
              }
            },
            {
              "@type": "Question",
              "name": "How long does it take to start?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Most hospitals can share 6 months of exports in a few days. You see the first findings in about two weeks."
              }
            },
            {
              "@type": "Question",
              "name": "What does it cost?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Pricing depends on hospital size. Start with a free claim audit."
              }
            }
          ]
        }
      ]
    }
    </script>
